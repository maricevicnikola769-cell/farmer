<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5E45">
<title>HerdDoc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikone/ikona-192.png">
<link rel="apple-touch-icon" href="ikone/ikona-192.png">
<style>
:root {
  --bg: #F3F5F1; --surf: #FFFFFF; --surf2: #E9EDE6; --ink: #18221C; --ink2: #56645A; --line: #D6DDD3;
  --tag: #F4C400; --tag-ink: #1B1A12; --brand: #2E5E45; --brand-h: #24503A;
  --ok: #2E7D4F; --ok-bg: #DFF0E4; --warn: #9A6200; --warn-bg: #FCEFD2; --bad: #B3261E; --bad-bg: #FBE3E1;
  --r: 14px; --nav: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(var(--nav) + env(safe-area-inset-bottom)); min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }

/* gornja traka */
.vrh { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); background: var(--brand); color: #fff; }
.vrh h1 { font-size: 19px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrh .nazad { background: none; border: 0; color: #fff; font-size: 26px; width: 40px; height: 40px; border-radius: 20px; cursor: pointer; }
.vrh .nazad:active { background: rgba(255,255,255,.15); }
.vrh .logo { width: 30px; height: 30px; border-radius: 8px; }

main { padding: 12px 12px 24px; max-width: 720px; margin: 0 auto; }

/* donja navigacija */
nav.dno { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; height: calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); background: var(--surf); border-top: 1px solid var(--line); }
nav.dno a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none;
  color: var(--ink2); font-size: 12px; font-weight: 600; position: relative; }
nav.dno a .ik { font-size: 22px; line-height: 1; }
nav.dno a.akt { color: var(--brand); }
nav.dno a.plus .ik { width: 48px; height: 48px; border-radius: 24px; background: var(--brand); color: #fff; display: grid; place-items: center;
  font-size: 30px; margin-top: -18px; box-shadow: 0 3px 10px rgba(0,0,0,.2); }
.brojac { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--bad); color: #fff; border-radius: 10px; font-size: 11px;
  min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; }

/* kartice i liste */
.kart { background: var(--surf); border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.kart h2 { font-size: 16px; margin: 0 0 10px; }
.kart h2 small { font-weight: 500; color: var(--ink2); }
.mali { font-size: 13px; color: var(--ink2); }
.lista { background: var(--surf); border-radius: var(--r); overflow: hidden; margin-bottom: 12px; }
.red { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--surf2); text-decoration: none; color: inherit; min-height: 60px; }
.red:last-child { border-bottom: 0; }
.red:active { background: var(--surf2); }
.red .sred { flex: 1; min-width: 0; }
.red .sred b { display: block; }
.red .sred span { display: block; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prazno { text-align: center; color: var(--ink2); padding: 40px 16px; }

.cip { display: inline-flex; align-items: center; gap: 6px; background: var(--tag); color: var(--tag-ink); font-weight: 800; border-radius: 8px;
  padding: 4px 10px; text-decoration: none; white-space: nowrap; font-size: 15px; }
.cip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; border: 2px solid var(--tag-ink); }
.cip.siv { background: var(--surf2); color: var(--ink2); }
.cip.siv::before { border-color: var(--ink2); }
.cip.veliki { font-size: 22px; padding: 6px 14px; }
.cipovi { display: flex; flex-wrap: wrap; gap: 8px; }

.znak { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.znak.ok { background: var(--ok-bg); color: var(--ok); }
.znak.warn { background: var(--warn-bg); color: var(--warn); }
.znak.bad { background: var(--bad-bg); color: var(--bad); }
.znak.siv { background: var(--surf2); color: var(--ink2); }

.rodlist { background: #fff; color: #111; padding: 14px; border-radius: 14px; overflow-x: auto; }
.rodlist h1 { font-size: 20px; margin: 0 0 10px; } .rodlist h2 { font-size: 16px; margin: 16px 0 6px; }
.rodlist table { border-collapse: collapse; width: 100%; font-size: 13px; }
.rodlist .podaci td { padding: 3px 8px 3px 0; border-bottom: 1px solid #eee; }
.rodlist .rod th { font-size: 12px; text-align: left; padding: 4px; background: #f2f2f2; border: 1px solid #ccc; }
.rodlist .rod td { border: 1px solid #ccc; padding: 4px 6px; vertical-align: middle; }
.rodlist .rod td.m { background: #eef4fb; } .rodlist .rod td.z { background: #fbeef3; } .rodlist .rod td.n { color: #999; font-style: italic; }
.rodlist .potpis { margin-top: 18px; font-size: 12px; color: #555; }
@media print {
  body.stampam > *:not(main):not(#ekran), body.stampam header, body.stampam nav, body.stampam #meni, body.stampam .ne-stampa, body.stampam .obavesti, body.stampam #poruka { display: none !important; }
  body.stampam, body.stampam #ekran { background: #fff !important; padding: 0 !important; margin: 0 !important; }
  body.stampam .rodlist { padding: 0; border-radius: 0; overflow: visible; }
  body.stampam .rodlist .rod td.m, body.stampam .rodlist .rod td.z { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.zvezde { display: flex; gap: 4px; margin-top: 6px; }
.zvezde button { font-size: 30px; line-height: 1; background: none; border: 0; color: var(--warn); padding: 4px 6px; cursor: pointer; }
.polja { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.polja dt { color: var(--ink2); }
.polja dd { margin: 0; font-weight: 600; }

/* pretraga i filteri */
.pretraga { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--surf); font-size: 17px; }
.nap-znak { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 6px; border-radius: 9px; background: #E07B00; color: #fff; font-size: 12px; font-weight: 900; }
.red .sred .nap-tekst, .nap-tekst { color: #7A4D00; font-weight: 700; white-space: normal; }
.info.nap { background: #FCEFD2; color: #7A4D00; border: 1px solid #E0B860; }
.filteri { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.filteri button { flex: none; border: 1px solid var(--line); background: var(--surf); border-radius: 20px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.stado-izbor { display: block; width: 100%; margin: 0 0 10px; border: 1px solid var(--line); background: var(--surf); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 15px; }
.dve-izbor { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dve-izbor .stado-izbor { font-size: 14px; padding: 9px 10px; min-width: 0; }
.stado-izbor.akt { background: var(--brand); border-color: var(--brand); color: #fff; }
.filteri button.akt { background: var(--brand); border-color: var(--brand); color: #fff; }

/* dugmad */
.dug { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surf); font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: var(--ink); }
.dug.glavno { background: var(--brand); border-color: var(--brand); color: #fff; }
.dug.opasno { color: var(--bad); }
.dug:active { filter: brightness(.93); }
.dug[disabled] { opacity: .5; }
.dug.puno { width: 100%; }
.dugmad { display: flex; gap: 10px; flex-wrap: wrap; }
.dugmad .dug { flex: 1 1 auto; }

/* forme */
label.polje { display: block; margin-bottom: 14px; }
label.polje > span { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
.unos { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surf); font-size: 17px; }
textarea.unos { min-height: 90px; resize: vertical; }
.unos:focus, .pretraga:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.dve { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.izbor { display: flex; flex-wrap: wrap; gap: 8px; }
.izbor button { border: 1px solid var(--line); background: var(--surf); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 15px; min-height: 44px; }
.izbor button.akt { background: var(--brand); color: #fff; border-color: var(--brand); }
.provera { display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 600; }
.provera input { width: 22px; height: 22px; accent-color: var(--brand); }
.greska { color: var(--bad); font-weight: 700; min-height: 1.4em; margin: 6px 0 10px; }
.info { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
.info.ok { background: var(--ok-bg); color: var(--ok); } .info.warn { background: var(--warn-bg); color: var(--warn); }
.info.bad { background: var(--bad-bg); color: var(--bad); } .info.siv { background: var(--surf2); color: var(--ink2); }
.brojevi { display: flex; align-items: center; gap: 0; }
.brojevi button { width: 48px; height: 48px; border: 1px solid var(--line); background: var(--surf2); font-size: 22px; font-weight: 700; }
.brojevi button:first-child { border-radius: 12px 0 0 12px; } .brojevi button:last-child { border-radius: 0 12px 12px 0; }
.brojevi input { width: 64px; height: 48px; text-align: center; border: 1px solid var(--line); border-left: 0; border-right: 0; font-size: 20px; font-weight: 700; }
.mlado { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.mlado .zag { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; }

/* obaveštenja */
.ob { display: flex; gap: 12px; background: var(--surf); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
.ob .traka { width: 5px; border-radius: 3px; flex: none; }
.ob .traka.n0 { background: var(--bad); } .ob .traka.n1 { background: var(--warn); } .ob .traka.n2 { background: var(--brand); } .ob .traka.n3 { background: var(--line); }
.ob .tekst { flex: 1; min-width: 0; }
.ob .tekst b { display: block; margin: 4px 0 2px; }
.ob .dugmad { margin-top: 10px; }
.ob .dugmad .dug { min-height: 42px; font-size: 15px; padding: 0 12px; }

/* istorija */
.ist { padding: 10px 0; border-bottom: 1px solid var(--surf2); }
.ist:last-child { border-bottom: 0; }
.ist .d { font-size: 13px; color: var(--ink2); }
.ist.auto { opacity: .7; }

/* partneri */
.f { font-weight: 800; font-size: 17px; min-width: 64px; text-align: right; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff;
  border-radius: 12px; padding: 12px 18px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.dobrodoslica { text-align: center; padding: 30px 8px; }
.dobrodoslica img { width: 96px; height: 96px; border-radius: 22px; }
.dobrodoslica h2 { font-size: 26px; margin: 14px 0 6px; }
.koraci { text-align: left; margin: 0; padding-left: 20px; color: var(--ink2); }
.koraci li { margin-bottom: 6px; }
.skriveno { display: none !important; }
.oblak { color: #fff; text-decoration: none; font-weight: 800; font-size: 15px; padding: 6px 8px; border-radius: 10px; }
.oblak.ceka { background: rgba(244,196,0,.25); } .oblak.greska { background: rgba(179,38,30,.5); } .oblak:empty { display: none; }
.sinh-tekst { font-weight: 700; } .sinh-tekst.ok { color: var(--ok); } .sinh-tekst.ceka { color: var(--warn); } .sinh-tekst.greska { color: var(--bad); }

/* skener minđuše */
.sakam { display: flex; gap: 8px; align-items: stretch; }
.sakam > input { flex: 1; min-width: 0; }
.kam { flex: none; width: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--surf); font-size: 22px; cursor: pointer; }
.kam:active { background: var(--surf2); }
/* obaveštenje pri ulasku u aplikaciju */
.prijava-okvir { z-index: 60 !important; background: var(--bg, #F4F6F4) !important; align-items: center !important; }
.prijava-okvir .okvir { border-radius: 18px !important; }
.obavesti { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.obavesti .okvir { background: var(--surf); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow: 0 -6px 24px rgba(0,0,0,.25); max-height: 80vh; overflow: auto; }
.obavesti h2 { margin: 0 0 4px; font-size: 20px; }
.obavesti .ob { background: var(--surf2); }
.skener { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
.skener video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.skener .okvir { position: absolute; left: 50%; top: 45%; width: min(78vw, 360px); height: min(46vw, 210px); transform: translate(-50%, -50%);
  border: 3px solid var(--tag); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
.skener-vrh { position: relative; padding: calc(18px + env(safe-area-inset-top)) 18px 14px; color: #fff; text-align: center; }
.skener-vrh b { display: block; font-size: 19px; } .skener-vrh span { display: block; font-size: 14px; opacity: .9; margin-top: 4px; }
.skener-dno { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
.skener-dno .dug { flex: 1 1 auto; padding: 0 10px; min-width: 0; }
.skener-dno { flex-wrap: wrap; }
.skener-dno .okidac { flex: 1 1 100%; height: 64px; font-size: 21px; }
.skener-dno .okidac:disabled { opacity: .75; }
.skener-info { position: absolute; left: 0; right: 0; bottom: calc(158px + env(safe-area-inset-bottom)); text-align: center; color: rgba(255,255,255,.7); font-size: 11px; padding: 0 12px; }
</style>
</head>
<body>
<header class="vrh"><button class="nazad skriveno" id="nazad" aria-label="Nazad">‹</button><img class="logo" id="logo" src="ikone/ikona-192.png" alt=""><h1 id="naslov">HerdDoc</h1><a id="oblak" class="oblak" href="#sinh"></a></header>
<main id="ekran"></main>
<nav class="dno" id="meni"></nav>
<input type="file" id="fajl" accept=".json,.txt,application/json,text/plain" class="skriveno">
<script>
// dnevnik grešaka (poslednjih 50) – šalje se preko „Više → Prijavi problem“
function zapisiGresku(gde, poruka) {
  try {
    const l = JSON.parse(localStorage.getItem("farmer-greske") || "[]");
    const d = new Date(), p2 = n => String(n).padStart(2, "0");
    l.push({ v: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`, g: gde, p: String(poruka || "").slice(0, 600) });
    localStorage.setItem("farmer-greske", JSON.stringify(l.slice(-50)));
  } catch (e) { /* nema mesta – nije važno */ }
}
window.addEventListener("error", e => zapisiGresku("greška", `${e.message || ""} @${(e.filename || "").split("/").pop()}:${e.lineno || ""}`));
window.addEventListener("unhandledrejection", e => zapisiGresku("greška", (e.reason && (e.reason.stack || e.reason.message)) || e.reason));
</script>
<script src="konstante.js"></script>
<script src="prevodi.js"></script>
<script src="logika.js"></script>
<script src="oblak-konfig.js"></script>
<script src="app.js"></script>
<script src="skener.js"></script>
<script src="oblak.js"></script>
</body>
</html>
