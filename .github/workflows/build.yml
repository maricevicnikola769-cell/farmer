name: Napravi EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Napravi EXE
        run: pyinstaller --onefile --windowed --name Farmer --icon farmer.ico --add-data "farmer.ico;." Farmer.pyw

      - name: Objavi u Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Farmer 1.${{ github.run_number }}
          files: dist/Farmer.exe
