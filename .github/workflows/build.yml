name: Napravi EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Napravi EXE
        run: pyinstaller --onefile --windowed --name Farmer --icon farmer.ico --add-data "farmer.ico;." Farmer.pyw

      - name: Napravi instalaciju
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=1.${{ github.run_number }}" farmer-instalacija.iss

      - name: Objavi u Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Farmer 1.${{ github.run_number }}
          files: |
            dist/Farmer-Setup.exe
            dist/Farmer.exe
